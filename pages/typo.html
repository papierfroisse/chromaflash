<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChromaFlash — Typo Rush 🔤</title>
  <link rel="stylesheet" href="../assets/css/design.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <style>
    body { padding-top: 60px; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; }
    
    .typo-layout {
      flex: 1;
      width: 100%;
      max-width: 800px;
      padding: var(--space-xl);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2xl);
    }

    .pangram-container {
      background: var(--bg-card);
      border: 1px solid var(--bg-border);
      border-radius: var(--radius-xl);
      padding: 60px 40px;
      width: 100%;
      text-align: center;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-lg);
      transition: opacity 0.3s;
    }

    .pangram-text {
      font-size: 2.5rem;
      line-height: 1.3;
      color: var(--text-primary);
    }

    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-md);
      width: 100%;
    }

    .typo-btn {
      padding: 20px;
      font-size: 1.1rem;
      font-weight: 600;
      background: var(--bg-input);
      border: 2px solid transparent;
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .typo-btn:hover {
      background: var(--bg-border);
      transform: translateY(-2px);
    }

    .typo-btn.correct { background: #34D399; color: #111; border-color: #34D399; }
    .typo-btn.wrong { background: #F87171; color: #111; border-color: #F87171; }
    
    @media (max-width: 640px) {
      .choices-grid { grid-template-columns: 1fr; }
      .pangram-text { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

<header class="game-header" style="width:100%; max-width:800px">
  <a href="../index.html" class="back-btn">← Accueil</a>
  <div class="text-xs text-muted" id="score-label">Score: 0 / 10</div>
  <div class="text-xs text-muted">🔤 Typo Rush</div>
</header>

<div class="typo-layout" id="game-layout">
  <div class="pangram-container anim-fadeUp" id="pangram-container">
    <div class="pangram-text" id="pangram-text">Chargement...</div>
  </div>

  <div class="choices-grid anim-fadeUp delay-2" id="choices-grid">
    <!-- Buttons injected here -->
  </div>
</div>

<!-- FINAL -->
<div id="final-layout" style="display:none; flex-direction:column; align-items:center; margin-top:100px;">
  <div class="text-4xl mb-sm" id="fin-emoji">🏆</div>
  <div class="text-3xl weight-700 mb-lg">FIN DU JEU</div>
  <div class="score-display mb-xl" id="fin-score">0</div>
  <button class="btn btn-primary btn-lg" onclick="location.reload()">Rejouer</button>
</div>

<script type="module">
  import { TYPO_FONTS, getRandomFonts } from '../assets/js/typo.js';
  import { Sound, animateCounter, launchConfetti } from '../assets/js/ui.js';

  const PANGRAMS = [
    "Portez ce vieux whisky au juge blond qui fume.",
    "Voyez le brick géant que j'examine près du wharf.",
    "The quick brown fox jumps over the lazy dog.",
    "Pack my box with five dozen liquor jugs."
  ];

  const TOTAL_ROUNDS = 10;
  let currentRound = 0;
  let score = 0;
  let currentTarget = null;
  let isWaiting = false;

  // Load ALL fonts so they don't pop-in (preloading)
  const fontLink = document.createElement('link');
  fontLink.rel = 'stylesheet';
  fontLink.href = 'https://fonts.googleapis.com/css2?' + TYPO_FONTS.map(f => `family=${f.import}`).join('&') + '&display=swap';
  document.head.appendChild(fontLink);

  const textEl = document.getElementById('pangram-text');
  const gridEl = document.getElementById('choices-grid');
  const containerEl = document.getElementById('pangram-container');

  // Wait a bit for fonts to load before starting
  setTimeout(nextRound, 800);

  function nextRound() {
    if (currentRound >= TOTAL_ROUNDS) return showFinal();
    
    currentRound++;
    document.getElementById('score-label').textContent = `Score: ${score} / ${TOTAL_ROUNDS}`;
    isWaiting = false;

    const choices = getRandomFonts(4);
    currentTarget = choices[Math.floor(Math.random() * 4)];

    textEl.style.fontFamily = `"${currentTarget.name}", ${currentTarget.category}`;
    textEl.textContent = PANGRAMS[Math.floor(Math.random() * PANGRAMS.length)];
    
    containerEl.style.opacity = 0;
    setTimeout(() => containerEl.style.opacity = 1, 50);

    gridEl.innerHTML = '';
    choices.forEach(font => {
      const btn = document.createElement('button');
      btn.className = 'typo-btn';
      btn.textContent = font.name;
      btn.onclick = () => handleGuess(btn, font.name);
      gridEl.appendChild(btn);
    });
  }

  function handleGuess(btn, guessName) {
    if (isWaiting) return;
    isWaiting = true;

    const isCorrect = guessName === currentTarget.name;
    if (isCorrect) {
      btn.classList.add('correct');
      Sound.good();
      score++;
    } else {
      btn.classList.add('wrong');
      Sound.wrong();
      // Highlight the correct one
      Array.from(gridEl.children).forEach(b => {
        if (b.textContent === currentTarget.name) b.classList.add('correct');
      });
    }

    document.getElementById('score-label').textContent = `Score: ${score} / ${TOTAL_ROUNDS}`;
    setTimeout(nextRound, 1200);
  }

  function showFinal() {
    document.getElementById('game-layout').style.display = 'none';
    const finalLayout = document.getElementById('final-layout');
    finalLayout.style.display = 'flex';
    
    const pct = score / TOTAL_ROUNDS;
    let emoji = '😵';
    if (pct === 1) { emoji = '💎'; launchConfetti(); Sound.perfect(); }
    else if (pct >= 0.8) { emoji = '⭐'; Sound.excellent(); }
    else if (pct >= 0.5) { emoji = '👍'; Sound.good(); }
    else { Sound.bad(); }

    document.getElementById('fin-emoji').textContent = emoji;
    animateCounter(document.getElementById('fin-score'), 0, score, 800);
  }
</script>
</body>
</html>
